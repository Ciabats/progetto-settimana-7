<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SportsHub — Eventi sportivi</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="assets/style/style.css">
</head>

<body>

  <header class="site-header text-center text-white py-5 px-3">

    <!-- Titolo dell'app + form di ricerca -->
    <div class="container">
      <h1 class="display-5 fw-bold mb-2">SportsHub</h1>
      <p class="subtitle lead mb-4">Cerca una squadra, scopri prossime partite e ultimi risultati</p>
    </div>

    <!-- form ricerca squadre -->
    <form id="form-ricerca" class="search mx-auto" role="search">
      <label for="q" class="visually-hidden">Nome della squadra</label>
      <div class="input-group input-group-lg">
        <input id="q" name="q" type="search" class="form-control" placeholder="es. Arsenal, Lakers, Real Madrid…">
        <button type="submit" class="btn btn-light fw-bold px-4">Cerca</button>
      </div>
    </form>
  </header>


  <main class="container py-4">

    <div id="alert" class="alert alert-danger" role="alert" hidden></div>

    <section class="section mb-5">
      <h2 class="h4 mb-3">⭐ Le tue squadre preferite</h2>
      <div id="preferiti" class="row row-cols-1 row-cols-sm-2 row-cols-lg-3 row-cols-xl-4 g-3"></div>
    </section>

    <section id="sez-appuntamenti" class="section mb-5" hidden>
      <h2 class="h4 mb-3">📅 I tuoi prossimi appuntamenti</h2>
      <div id="appuntamenti"></div>
    </section>

    <section id="risultati-section" class="section mb-5">

      <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
        <h2 class="h4 mb-0">Squadre trovate</h2>
        <div id="filtri" class="filters d-flex flex-wrap gap-2" role="group" aria-label="Filtra per sport">
          <button type="button" class="btn btn-sm rounded-pill" data-sport="all" aria-pressed="true">Tutti</button>
          <button type="button" class="btn btn-sm rounded-pill" data-sport="Soccer" aria-pressed="false">Calcio</button>
          <button type="button" class="btn btn-sm rounded-pill" data-sport="Basketball"
            aria-pressed="false">Basket</button>
          <button type="button" class="btn btn-sm rounded-pill" data-sport="American Football"
            aria-pressed="false">Football</button>
        </div>
      </div>
      <div id="risultati" class="row row-cols-1 row-cols-sm-2 row-cols-lg-3 row-cols-xl-4 g-3" aria-live="polite"></div>
    </section>

    <section id="dettagli-section" class="card shadow-sm p-4" hidden aria-live="polite">
      <!-- Spinner, errore, lista risultati ricerca squadre -->
    </section>

  </main>

  <dialog id="modale" class="modale">
    <div id="modale-contenuto"></div>
    <form method="dialog" class="text-end">
      <button type="submit" class="btn btn-primary btn-chiudi">Chiudi</button>
    </form>
  </dialog>

  <script type="module" src="assets/script/script.js"></script>
</body>

</html>
